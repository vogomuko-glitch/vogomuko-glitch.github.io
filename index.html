<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="교토 6일">
<meta name="theme-color" content="#1b1f24">
<title>교토 6일</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 상단 고정 날짜 탭 + 세로 타임라인. 장소 카드(흰 면) / 이동 카드(점선 레일) 두 종류만. */
:root{
  --bg:#eef0ec; --card:#ffffff; --ink:#1b1f24; --ink2:#5a6168; --line:#d9ddd6;
  --accent:#2f6b4f; --accent-soft:#e2efe7; --warn:#a1620a; --warn-soft:#fbefd9;
  --ok:#2f6b4f; --skip:#8a8f94; --rail:#b9c0b7;
  --font:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15181b; --card:#1f2327; --ink:#eceff1; --ink2:#a4acb3; --line:#30363c;
  --accent:#7cc39c; --accent-soft:#213a2e; --warn:#f0b35b; --warn-soft:#3b2d14;
  --ok:#7cc39c; --skip:#737a80; --rail:#4a525a; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#15181b; --card:#1f2327; --ink:#eceff1; --ink2:#a4acb3; --line:#30363c;
  --accent:#7cc39c; --accent-soft:#213a2e; --warn:#f0b35b; --warn-soft:#3b2d14;
  --ok:#7cc39c; --skip:#737a80; --rail:#4a525a; color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}

/* 헤더 */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.top-in{padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--ink2)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:64px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);text-align:left;line-height:1.2}
.tab b{display:block;font-size:14px}
.tab span{display:block;font-size:11px;color:var(--ink2);margin-top:2px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.on span{color:var(--bg);opacity:.75}

/* 본문 */
.wrap{padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));max-width:680px;margin:0 auto}
.day-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin:2px 0 12px}
.day-head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.day-head .city{font-size:13px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.chip.home{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.warn{border-color:transparent;color:var(--warn);background:var(--warn-soft)}

/* 타임라인 */
.tl{position:relative;padding-left:58px}
.tl::before{content:"";position:absolute;left:49px;top:6px;bottom:6px;width:2px;background:var(--rail);border-radius:2px}
.item{position:relative;margin-bottom:14px}
.t{position:absolute;left:-58px;top:10px;width:44px;text-align:right;font-size:12px;line-height:1.25;color:var(--ink2)}
.t b{display:block;color:var(--ink);font-size:13px;font-weight:600}
.dot{position:absolute;left:-14px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.item.leg .dot{width:8px;height:8px;left:-12px;top:16px;border-color:var(--rail);background:var(--rail)}
.item.done .dot{background:var(--ok);border-color:var(--ok)}
.item.skip{opacity:.5}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card .hd{padding:12px 14px 0}
.name{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.25;margin:0}
.ja{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.4}
.what{margin:8px 0 0;font-size:14px}
.why{margin:4px 0 0;font-size:13px;color:var(--ink2)}
.meta{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px 0}
.tag{font-size:11.5px;padding:3px 8px;border-radius:7px;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
.tag.v{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.money{color:var(--ink);font-weight:600}
.todo{margin:10px 14px 0;padding:9px 11px;border-radius:10px;background:var(--accent-soft);font-size:13px}
.todo b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.note{margin:8px 14px 0;font-size:12.5px;color:var(--ink2)}
.sv{margin:12px 0 0;aspect-ratio:16/10;max-width:100%;background:var(--bg);position:relative}
.sv iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sv .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2)}
.svb{padding:12px 14px 0;display:flex}
.acts{display:flex;gap:8px;padding:10px 14px 12px;flex-wrap:wrap}
.btn{flex:1 1 auto;min-width:0;text-align:center;font-size:13px;font-weight:600;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{flex:0 0 auto;font-weight:500}
.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item.done .btn.chk{background:var(--accent);border-color:var(--accent);color:#fff}
.item.skip .btn.skp{background:var(--skip);border-color:var(--skip);color:#fff}

/* 이동 카드 */
.leg .card{background:transparent;border:1px dashed var(--rail);border-radius:12px}
.leg .route{padding:10px 14px 0;font-size:14px;font-weight:600}
.leg .route span{color:var(--ink2);font-weight:400}
.steps{list-style:none;margin:8px 0 0;padding:0 14px}
.steps li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px;align-items:start}
.steps li:first-child{border-top:0}
.steps .ic{font-size:14px;line-height:1.4}
.steps .s{min-width:0}
.steps .s small{display:block;color:var(--ink2);font-size:11.5px;line-height:1.35}
.steps .r{text-align:right;color:var(--ink2);font-size:12px;white-space:nowrap}
.steps .r b{display:block;color:var(--ink);font-weight:600}
.sum{display:flex;justify-content:space-between;gap:8px;padding:8px 14px 0;font-size:13px}
.sum b{font-weight:700}

/* 귀국 계산 */
.calc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.calc label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px}
.calc input{font:inherit;font-size:20px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.calc table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.calc td{padding:7px 0;border-top:1px solid var(--line)}
.calc td:last-child{text-align:right;font-weight:700}
.calc .hint{font-size:12px;color:var(--ink2);margin-top:8px}

/* 하단 바 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;background:var(--bg);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .btn{padding:11px 8px}

/* 시트 */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet .pn{background:var(--bg);width:100%;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pn h3{margin:4px 0 10px;font-size:18px}
.pn h4{margin:16px 0 6px;font-size:13px;letter-spacing:.04em;color:var(--ink2);text-transform:uppercase}
.kv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:8px}
.kv b{display:block;font-size:13px;margin-bottom:2px}
.kv small{color:var(--ink2);display:block;font-size:12px}
.ph2{display:grid;grid-template-columns:1fr;gap:6px}
.ph2 .kv{margin:0}
.ph2 .jp{font-size:15px;font-weight:600}
.ph2 .ro{color:var(--accent)}
.close{width:100%;margin-top:14px}
@media (prefers-reduced-motion:no-preference){.card{transition:opacity .2s}}
</style>
</head>

/* ============ 상태 저장 ============ */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let marks = LS.get('kyoto.marks',{});
let flight = LS.get('kyoto.flight','');

/* ============ 렌더 ============ */
const STATUS = { user:['내가 정한 시간',''], tt:['공식 시간표','ok'], est:['예상 · 현장 확인','v'], v:['확인 필요','v'] };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function jpNow(){ // 일본 시간 = 한국 시간
  const n=new Date(); return {m:n.getMonth()+1,d:n.getDate(),hm:n.getHours()*60+n.getMinutes()};
}
function dayIndexForToday(){
  const {m,d}=jpNow(); const key=m+'/'+d;
  const i=DAYS.findIndex(x=>x.d===key); return i<0?0:i;
}
let cur = LS.get('kyoto.day', null);
if(cur==null || !DAYS.some(x=>x.id===cur)) cur = DAYS[dayIndexForToday()].id;

function render(){
  const tabs=document.getElementById('tabs');
  tabs.innerHTML = DAYS.map(x=>`<button class="tab ${x.id===cur?'on':''}" data-id="${x.id}" aria-pressed="${x.id===cur}"><b>${x.d}</b><span>${x.w} · ${esc(x.title.split(' · ')[0])}</span></button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur=b.dataset.id;LS.set('kyoto.day',cur);render();window.scrollTo(0,0);});
  const day=DAYS.find(x=>x.id===cur);
  const main=document.getElementById('main');
  const nv=day.items.filter(i=>i.st==='v'||i.st==='est').length;
  let html=`<div class="day-head"><h2>${esc(day.title)}</h2><span class="city">${esc(day.city)}</span></div>
  <div class="chips">${day.home?`<span class="chip home">🏠 ${esc(day.home)}</span>`:''}<span class="chip">${day.items.filter(i=>i.k==='p').length}곳</span>${nv?`<span class="chip warn">현장 확인 ${nv}건</span>`:''}</div>`;
  if(day.flight) html+=calcHTML();
  html+='<div class="tl">'+day.items.map((it,idx)=>it.k==='p'?placeHTML(day,it,idx):legHTML(day,it,idx)).join('')+'</div>';
  main.innerHTML=html;
  bind(day);
  loadFrames();
  document.getElementById('today').textContent = (()=>{const {m,d}=jpNow();return `오늘 ${m}/${d} · 일본시간=한국시간`;})();
}
function markOf(day,idx){ return marks[day.id+':'+idx]||''; }
const HOSTED = /claude|artifact/.test(location.hostname);
function placeHTML(day,it,idx){
  const mk=markOf(day,idx); const [sl,sc]=STATUS[it.st]||STATUS.est;
  const frame = HOSTED
    ? `<div class="svb"><a class="btn pri" target="_blank" rel="noopener" href="${it.lat?`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${it.lat},${it.lng}`:gmap(it.q||it.name)}">👀 ${it.lat&&!it.approx?'로드뷰 보기 (구글맵 앱으로 열림)':'지도에서 위치 보기'}</a></div>`
    : (it.lat&&!it.approx)
    ? `<div class="sv"><iframe title="로드뷰 ${esc(it.name)}" data-src="${svurl(it.lat,it.lng,it.h||0)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe><div class="ph">로드뷰 불러오는 중…</div></div>`
    : `<div class="sv"><iframe title="지도 ${esc(it.name)}" data-src="${mapurl(it.q)}" loading="lazy"></iframe><div class="ph">지도 불러오는 중…</div></div>`;
  return `<div class="item ${mk}" data-idx="${idx}">
    <div class="t"><b class="num">${esc(it.t)}</b>${it.approx?'위치 근사':''}</div><div class="dot"></div>
    <div class="card">
      <div class="hd"><h3 class="name">${esc(it.name)}</h3><div class="ja">${esc(it.ja)}</div>
        ${it.what?`<p class="what">${esc(it.what)}</p>`:''}${it.why?`<p class="why">${esc(it.why)}</p>`:''}</div>
      <div class="meta"><span class="tag ${sc}">${sl}</span>${(it.tags||[]).map(t=>`<span class="tag ${/엔|무료|표$/.test(t)?'money':''}">${esc(t)}</span>`).join('')}</div>
      ${it.todo?`<div class="todo"><b>할 일</b>${it.todo.map(t=>'· '+esc(t)).join('<br>')}</div>`:''}
      ${frame}
      <div class="acts">
        <a class="btn" target="_blank" rel="noopener" href="${gmap(it.q||it.name)}">📍 지도 열기</a>
        ${it.lat?`<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${it.lat},${it.lng}">👀 로드뷰 크게</a>`:''}
        <button class="btn chk" data-m="done">✓ 다녀옴</button><button class="btn skp sm" data-m="skip">건너뜀</button>
      </div>
    </div></div>`;
}
function legHTML(day,it,idx){
  const mk=markOf(day,idx); const [sl,sc]=STATUS[it.st]||STATUS.est;
  return `<div class="item leg ${mk}" data-idx="${idx}">
    <div class="t"><b class="num">${esc(it.t)}</b>이동</div><div class="dot"></div>
    <div class="card">
      <div class="route">${esc(it.from)} <span>→</span> ${esc(it.to)}</div>
      <ul class="steps">${it.steps.map(s=>`<li><span class="ic">${s[0]}</span><span class="s">${esc(s[1])}${s[2]?`<small>${esc(s[2])}</small>`:''}</span><span class="r num"><b>${esc(s[3])}</b>${esc(s[4])}</span></li>`).join('')}</ul>
      <div class="sum"><span>합계</span><b>${esc(it.total||'')}</b></div>
      <div class="meta"><span class="tag ${sc}">${sl}</span>${/Suica OK/.test(it.total||'')?'<span class="tag ok">Suica 찍고 타면 됨</span>':''}</div>
      ${it.alt?`<p class="note">대안: ${esc(it.alt)}</p>`:''}${it.note?`<p class="note">${esc(it.note)}</p>`:''}
      <div class="acts"><a class="btn pri" target="_blank" rel="noopener" href="${gdir(it.q1,it.q2)}">🧭 구글맵 길찾기</a><button class="btn chk sm" data-m="done">✓</button></div>
    </div></div>`;
}
function bind(day){
  document.querySelectorAll('.item [data-m]').forEach(b=>b.onclick=()=>{
    const idx=b.closest('.item').dataset.idx, key=day.id+':'+idx, m=b.dataset.m;
    marks[key] = marks[key]===m ? '' : m; LS.set('kyoto.marks',marks); render();
  });
  const f=document.getElementById('flight'); if(f){ f.oninput=()=>{flight=f.value;LS.set('kyoto.flight',flight);document.getElementById('calcOut').innerHTML=calcRows();}; }
}
function loadFrames(){ document.querySelectorAll('iframe[data-src]').forEach(fr=>{ fr.src=fr.dataset.src; fr.removeAttribute('data-src'); }); }

/* 귀국 역산 */
function calcHTML(){ return `<div class="calc"><label for="flight">귀국 항공편 출발 시각 (현지)</label><input id="flight" type="time" value="${esc(flight)}"><div id="calcOut">${calcRows()}</div><p class="hint">공항 도착 = 출발 2시간 전 · 하루카 75분 · 교토역 여유 20분 · 숙소→교토역 택시 40분. 하루카 표는 10/31에 이 시각 맞춰 끊어두기.</p></div>`; }
function calcRows(){
  if(!flight) return '<table><tr><td>시각을 넣으면 출발 시간이 나와</td><td>—</td></tr></table>';
  const [h,m]=flight.split(':').map(Number); let t=h*60+m;
  const f=x=>{x=((x%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');};
  const rows=[['공항 도착(출발 2시간 전)',t-120],['하루카 교토역 출발',t-120-75],['교토역 도착 목표',t-120-75-20],['숙소 체크아웃 · 택시',t-120-75-20-40]];
  return '<table>'+rows.map(r=>`<tr><td>${r[0]}</td><td class="num">${f(r[1])}</td></tr>`).join('')+'</table>';
}
